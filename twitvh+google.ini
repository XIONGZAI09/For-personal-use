[custom]
; ================================
; 基础
; ================================
enable_rule_generator=true
overwrite_original_rules=true

; ================================
; 节点清理
; ================================
exclude=流量|到期|剩余|套餐|官网|网站|失联|重置

; ================================
; 策略组
; ================================
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇺🇸 美国节点`[]🇭🇰 香港节点`[]DIRECT
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国节点`select`(美|US|United States)
custom_proxy_group=🇺🇸 香港节点`select`(港|HK|United States)


; ================================
; Twitch（走代理）
; ================================
ruleset=📺 Twitch,[]DOMAIN-SUFFIX,twitch.tv
ruleset=📺 Twitch,[]DOMAIN-SUFFIX,ttvnw.net
ruleset=📺 Twitch,[]DOMAIN-SUFFIX,jtvnw.net

; ================================
; Google（走代理）
; ================================
ruleset=🌐 Google,[]DOMAIN-SUFFIX,google.com
ruleset=🌐 Google,[]DOMAIN-SUFFIX,googleapis.com
ruleset=🌐 Google,[]DOMAIN-SUFFIX,gstatic.com
ruleset=🌐 Google,[]DOMAIN-SUFFIX,googlevideo.com
ruleset=🌐 Google,[]DOMAIN-SUFFIX,ytimg.com
ruleset=🌐 Google,[]DOMAIN-SUFFIX,youtube.com

; ================================
; 其他全部直连
; ================================
ruleset=🌏 全部直连,[]FINAL

; ================================
; 策略绑定
; ================================
custom_proxy_group=📺 Twitch`select`[]🇺🇸 美国节点`[]🇭🇰 香港节点`[]♻️ 自动选择
custom_proxy_group=🌐 Google`select`[]🇺🇸 美国节点`[]🇭🇰 香港节点`[]♻️ 自动选择
custom_proxy_group=🌏 全部直连`select`[]DIRECT
